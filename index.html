<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TAROS 蘭嶼食物主權資料庫</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="expbar" role="note" data-i="expBar"></div>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#top">TAROS <span>·</span> Pongso no Tao</a>
    <nav class="sections" aria-label="Sections">
      <a href="#taros" data-i="navTaros"></a>
      <a href="#pacific" data-i="navPacific"></a>
      <a href="#database" data-i="navDb"></a>
      <a href="#recipes" data-i="navRecipes"></a>
      <a href="#villages" data-i="navVillages"></a>
      <a href="#visit" data-i="navVisit"></a>
      <a href="#research" data-i="navResearch"></a>
    </nav>
    <div class="langs" role="group" aria-label="Language">
      <button data-lang="zh" aria-pressed="true">中文</button>
      <button data-lang="en" aria-pressed="false">EN</button>
      <button data-lang="tao" aria-pressed="false">Tao</button>
    </div>
  </div>
</header>
<div class="taobar" id="taobar" data-i="taoBar"></div>

<main id="top">
<section class="hero">
  <div class="wrap">
    <div>
      <p class="greet" aria-label="Pacific greetings"><span>Aloha</span><span>Talofa</span><span>Bula</span><span>Kia ora</span><span>Mālō e lelei</span><span>Håfa adai</span></p>
      <h1 data-i="heroTitle"></h1>
      <p class="lede" data-i="heroLede"></p>
      <div class="now" id="now"><strong id="nowTitle"></strong><small id="nowSub"></small></div>
      <div class="btns">
        <a class="btn" href="#database" data-i="heroBtn1"></a>
        <a class="btn ghost" href="#recipes" data-i="heroBtn2"></a>
      </div>
    </div>
    <div class="wheel-box">
      <svg id="wheel" viewBox="0 0 400 400" role="group" aria-label="Tao seasonal calendar"></svg>
      <div class="wheel-cap" data-i="wheelCap"></div>
    </div>
  </div>
  <svg class="stars" id="stars" aria-hidden="true" preserveAspectRatio="none" viewBox="0 0 1000 600"></svg>
  <svg class="swell" aria-hidden="true" viewBox="0 0 1440 90" preserveAspectRatio="none">
    <path d="M0 40 C180 10 360 70 540 40 S900 10 1080 40 1300 60 1440 34 V90 H0Z" fill="#1C8C88" opacity=".35"/>
    <path d="M0 58 C200 30 380 84 600 56 S960 30 1160 58 1340 70 1440 52 V90 H0Z" fill="#8FE3DC" opacity=".25"/>
    <path d="M0 72 C220 52 420 92 660 70 S1020 54 1220 72 1380 80 1440 70 V90 H0Z" fill="var(--lime)"/>
  </svg>
</section>

<section class="block" id="taros">
  <div class="wrap">
    <div class="head"><div><h2 data-i="tarosTitle"></h2><p data-i="tarosLede"></p></div></div>
    <div class="taros" id="tarosGrid"></div>
  </div>
</section>

<section class="block" id="pacific">
  <div class="wrap">
    <div class="head"><div><h2 data-i="pacTitle"></h2><p data-i="pacLede"></p></div></div>
    <p class="hauofa"><span data-i="hauofa"></span><small data-i="hauofaSrc"></small></p>
    <div class="voyage"><svg id="vmap" viewBox="0 0 1000 540" role="group" aria-label="Pacific voyaging map"></svg><div class="vpanel" id="vpanel" aria-live="polite"></div></div>
    <p class="vhint" data-i="vHint"></p>
    <h3 style="font-size:22px;margin:40px 0 14px" data-i="wordsTitle"></h3>
    <div class="scroll"><table id="words"></table></div>
  </div>
</section>

<section class="block" id="database">
  <div class="wrap">
    <div class="head"><div><h2 data-i="dbTitle"></h2><p data-i="dbLede"></p></div></div>
    <div class="search"><input id="q" type="search" autocomplete="off"></div>
    <div class="filters" id="filters"></div>
    <div class="count" id="count" aria-live="polite"></div>
    <div class="grid" id="grid"></div>
  </div>
</section>

<section class="block" id="recipes">
  <div class="wrap">
    <div class="head"><div><h2 data-i="recTitle"></h2><p data-i="recLede"></p></div></div>
    <div class="recipes">
      <div class="rlist" id="rlist"></div>
      <article class="rcard" id="rcard" aria-live="polite"></article>
    </div>
  </div>
</section>

<section class="block" id="villages">
  <div class="wrap">
    <div class="head"><div><h2 data-i="vilTitle"></h2><p data-i="vilLede"></p></div></div>
    <div class="villages" id="vilGrid"></div>
  </div>
</section>

<section class="block" id="visit">
  <div class="wrap">
    <div class="head"><div><h2 data-i="visitTitle"></h2><p data-i="visitLede"></p></div></div>
    <div class="rules" id="rules"></div>
  </div>
</section>

<section class="block" id="game">
  <div class="wrap">
    <div class="game">
      <div>
        <h3 data-i="gameTitle"></h3>
        <p data-i="gameLede"></p>
        <a class="btn" href="https://claude.ai/artifact/Hk3pXi1bKbNeKcVk3j9ach" target="_blank" rel="noopener" id="gameBtn" data-i="gameBtn"></a>
      </div>
      <div class="roles" id="roles"></div>
    </div>
  </div>
</section>



<section class="block" id="peoples">
  <div class="wrap">
    <div class="head"><div><h2 data-i="pplTitle"></h2><p data-i="pplLede"></p></div></div>
    <div class="peoples" id="pplGrid"></div>
    <div class="austro" id="austro"></div>
  </div>
</section>

<section class="block" id="research">
  <div class="wrap">
    <div class="head"><div><h2 data-i="resTitle"></h2><p data-i="resLede"></p></div></div>
    <div class="method" id="method"></div>
  </div>
</section>
</main>

<footer><div class="wrap" data-i="footer"></div></footer>

<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>

<button class="chat-fab" id="chatFab" hidden data-i="chatFab"></button>
<div class="chat" id="chat" role="dialog" aria-label="Food assistant">
  <div class="chat-h"><b data-i="chatTitle"></b><button id="chatClose" data-i="close"></button></div>
  <div class="msgs" id="msgs"></div>
  <div class="sugs" id="sugs"></div>
  <form id="chatForm"><input id="chatIn" autocomplete="off"><button data-i="send"></button></form>
  <div class="disc" data-i="chatDisc"></div>
</div>

<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/map.js"></script>
<script src="js/app.js"></script>
</body>
</html>
