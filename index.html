<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TAROS 蘭嶼食物主權資料庫</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{
  --lime:#F3F5F2;        /* 石灰白 */
  --paper:#FFFFFF;
  --soot:#1E1B19;        /* 煙炱黑 */
  --ink-soft:#4C4744;
  --red:#A8322B;         /* 船紅 */
  --kuroshio:#124B5A;    /* 黑潮藍 */
  --ochre:#B97A1E;       /* 曬魚季的陽光 */
  --taro:#4F6B3A;        /* 芋葉綠 */
  --line:#D8DCD7;
  --chip:#E7EBE6;
  --focus:#124B5A;
  --lagoon:#1C8C88;
  --deep:#0A2E3D;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --lime:#151816;--paper:#1D211F;--soot:#ECEAE6;--ink-soft:#B9B4AF;
    --red:#E0675C;--kuroshio:#6FB3C4;--ochre:#E0A54A;--taro:#9CBF7E;
    --line:#333A36;--chip:#28302C;--focus:#6FB3C4;--lagoon:#5CC6C0;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --lagoon:#5CC6C0;
  --lime:#151816;--paper:#1D211F;--soot:#ECEAE6;--ink-soft:#B9B4AF;
  --red:#E0675C;--kuroshio:#6FB3C4;--ochre:#E0A54A;--taro:#9CBF7E;
  --line:#333A36;--chip:#28302C;--focus:#6FB3C4;color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px);scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{margin:0;background:var(--lime);color:var(--soot);font-family:var(--sans);font-size:17px;line-height:1.75}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
img,svg{max-width:100%}
a{color:var(--kuroshio)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3{font-family:var(--serif);line-height:1.3;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}

/* nav */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:2px solid var(--soot)}
.top .wrap{display:flex;align-items:center;gap:20px;min-height:62px}
.brand{font-family:var(--serif);font-weight:900;font-size:20px;text-decoration:none;color:var(--soot);white-space:nowrap}
.brand span{color:var(--red)}
nav.sections{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none}
nav.sections a{text-decoration:none;color:var(--ink-soft);font-size:15px;padding:6px 10px;border-radius:4px;white-space:nowrap}
nav.sections a:hover{background:var(--chip);color:var(--soot)}
.langs{display:flex;border:1.5px solid var(--soot);border-radius:4px;overflow:hidden;flex-shrink:0}
.langs button{font:inherit;font-size:14px;background:transparent;color:var(--soot);border:0;padding:5px 11px;cursor:pointer}
.langs button+button{border-left:1.5px solid var(--soot)}
.langs button[aria-pressed="true"]{background:var(--soot);color:var(--paper)}
@media (max-width:820px){nav.sections{display:none}}

/* hero */
.hero{--soot:#F2F7F6;--ink-soft:#A9C7CC;--paper:#0A2E3D;--line:rgba(255,255,255,.18);--focus:#8FE3DC;
  background:radial-gradient(120% 90% at 85% 10%,#1C6E78 0%,#0E4554 45%,#0A2E3D 100%);color:var(--soot);position:relative;overflow:hidden}
.hero .wrap{position:relative;z-index:1}
.hero .swell{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:90px;z-index:0;display:block}
.hero .stars{position:absolute;inset:0;z-index:0;opacity:.55}
.greet{display:flex;flex-wrap:wrap;gap:6px 18px;margin:0 0 18px;font-size:15px;color:#8FE3DC;font-family:var(--serif)}
.greet span{white-space:nowrap}
.hero .wrap{display:grid;grid-template-columns:1.1fr 1fr;gap:48px;align-items:center;padding-top:64px;padding-bottom:120px}
.hero h1{font-size:clamp(34px,5vw,58px);font-weight:900;letter-spacing:.02em}
.hero .lede{font-size:19px;color:var(--ink-soft);max-width:34em;margin:20px 0 28px}
.now{border-left:6px solid var(--season,var(--kuroshio));padding:10px 0 10px 16px;margin-bottom:28px}
.now strong{font-family:var(--serif);font-size:24px;display:block}
.now small{color:var(--ink-soft);font-size:15px}
.btns{display:flex;flex-wrap:wrap;gap:12px}
.btn{font:inherit;font-weight:700;font-size:16px;padding:11px 20px;border-radius:4px;border:2px solid var(--soot);background:var(--soot);color:var(--paper);cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--soot)}
.wheel-box{position:relative}
.wheel-box svg{display:block;width:100%;height:auto}
.wheel-seg{cursor:pointer;transition:opacity .2s}
.wheel-seg:hover,.wheel-seg:focus-visible{opacity:.82}
.wheel-cap{text-align:center;font-size:14px;color:var(--ink-soft);margin-top:8px}
@media (max-width:820px){.hero .wrap{grid-template-columns:1fr;gap:32px}.wheel-box{max-width:380px;margin:0 auto}}

section.block{padding:72px 0;border-bottom:1px solid var(--line)}
.head{display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;margin-bottom:32px}
.head h2{font-size:clamp(28px,3.4vw,38px);font-weight:900}
.head h2::before{content:"";display:block;width:72px;height:12px;margin-bottom:14px;background:var(--lagoon);-webkit-mask:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%2072%2012%27%3E%3Cpath%20d%3D%27M0%206%20Q9%200%2018%206%20T36%206%20T54%206%20T72%206%27%20fill%3D%27none%27%20stroke%3D%27black%27%20stroke-width%3D%273%27/%3E%3C/svg%3E") no-repeat center/contain;mask:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%2072%2012%27%3E%3Cpath%20d%3D%27M0%206%20Q9%200%2018%206%20T36%206%20T54%206%20T72%206%27%20fill%3D%27none%27%20stroke%3D%27black%27%20stroke-width%3D%273%27/%3E%3C/svg%3E") no-repeat center/contain}
footer::before{content:"";display:block;height:14px;margin-bottom:28px;background:var(--lagoon);opacity:.7;-webkit-mask:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%2040%2014%27%3E%3Cpath%20d%3D%27M0%207%20Q10%200%2020%207%20T40%207%27%20fill%3D%27none%27%20stroke%3D%27black%27%20stroke-width%3D%272.5%27/%3E%3C/svg%3E") repeat-x left center/40px 14px;mask:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%2040%2014%27%3E%3Cpath%20d%3D%27M0%207%20Q10%200%2020%207%20T40%207%27%20fill%3D%27none%27%20stroke%3D%27black%27%20stroke-width%3D%272.5%27/%3E%3C/svg%3E") repeat-x left center/40px 14px}
.head p{max-width:40em;color:var(--ink-soft);margin:8px 0 0}

/* TAROS */
.taros{display:grid;grid-template-columns:repeat(5,1fr);border-top:2px solid var(--soot);border-bottom:2px solid var(--soot)}
.pillar{padding:22px 18px 26px;border-right:1px solid var(--line)}
.pillar:last-child{border-right:0}
.pillar .L{font-family:var(--serif);font-size:64px;font-weight:900;line-height:1;color:var(--red)}
.pillar:nth-child(even) .L{color:var(--lagoon)}
.pillar h3{font-size:18px;margin:10px 0 2px}
.pillar .en{font-size:13px;color:var(--ink-soft);margin-bottom:10px}
.pillar p{font-size:15px;margin:0;line-height:1.7}
@media (max-width:960px){.taros{grid-template-columns:1fr 1fr}.pillar{border-bottom:1px solid var(--line)}}
@media (max-width:560px){.taros{grid-template-columns:1fr}}

/* database */
.search{display:flex;gap:10px;margin-bottom:16px}
.search input{flex:1;font:inherit;padding:12px 14px;border:2px solid var(--soot);border-radius:4px;background:var(--paper);color:var(--soot)}
.filters{display:flex;flex-direction:column;gap:10px;margin-bottom:24px}
.frow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.frow .lab{font-size:14px;color:var(--ink-soft);min-width:4.5em}
.chip{font:inherit;font-size:14px;padding:4px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--paper);color:var(--soot);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--soot);background:var(--soot);color:var(--paper)}
.count{font-size:14px;color:var(--ink-soft);margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.food{text-align:left;font:inherit;color:inherit;background:var(--paper);border:1px solid var(--line);border-top:5px solid var(--cat,var(--kuroshio));border-radius:2px;padding:16px 18px 18px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.food:hover{border-color:var(--soot);border-top-color:var(--cat)}
.food .tao{font-family:var(--serif);font-size:22px;font-weight:900}
.food .sub{font-size:14px;color:var(--ink-soft)}
.food p{font-size:15px;margin:4px 0 0;line-height:1.65;color:var(--ink-soft)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:8px}
.tag{font-size:12px;padding:1px 8px;border-radius:3px;background:var(--chip);color:var(--soot)}
.tag.lit{background:transparent;border:1px solid var(--kuroshio);color:var(--kuroshio)}
.tag.int{background:transparent;border:1px solid var(--taro);color:var(--taro)}
.tag.verify{background:transparent;border:1px dashed var(--red);color:var(--red)}
.empty{padding:32px;border:1.5px dashed var(--line);text-align:center;color:var(--ink-soft)}

dialog{max-width:640px;width:calc(100% - 32px);border:2px solid var(--soot);border-radius:4px;padding:0;background:var(--paper);color:var(--soot)}
dialog::backdrop{background:rgba(20,18,16,.55)}
.dlg{padding:28px 28px 24px}
.dlg h3{font-size:30px;font-weight:900}
.dlg dl{display:grid;grid-template-columns:7em 1fr;gap:8px 16px;margin:20px 0;font-size:15px}
.dlg dt{color:var(--ink-soft)}
.dlg dd{margin:0}
.dlg .close{float:right;font:inherit;background:none;border:1.5px solid var(--soot);color:var(--soot);border-radius:4px;padding:4px 12px;cursor:pointer}
.srcs{border-top:1px solid var(--line);padding-top:14px;font-size:14px}
.srcs li{margin-bottom:4px}

/* recipes */
.recipes{display:grid;grid-template-columns:260px 1fr;gap:32px;align-items:start}
.rlist{display:flex;flex-direction:column;border-top:2px solid var(--soot)}
.rlist button{font:inherit;text-align:left;padding:14px 4px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--soot);cursor:pointer}
.rlist button[aria-current="true"]{font-weight:700;color:var(--red)}
.rcard{background:var(--paper);border:1px solid var(--line);padding:28px}
.rcard h3{font-size:28px;font-weight:900}
.rcard .meta{color:var(--ink-soft);font-size:15px;margin:6px 0 18px}
.rcard h4{font-size:16px;margin:20px 0 8px}
.rcard ol{padding-left:1.4em;margin:0}
.rcard ol li{margin-bottom:6px}
.note{font-size:14px;border-left:4px solid var(--ochre);padding:8px 12px;background:var(--chip);margin-top:18px}
@media (max-width:760px){.recipes{grid-template-columns:1fr}}

/* villages */
.villages{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:2px solid var(--soot)}
.vil{padding:20px 18px 22px;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.vil:nth-child(3n){border-right:0}
.vil .tn{font-family:var(--serif);font-size:24px;font-weight:900}
.vil .zn{font-size:15px;color:var(--ink-soft)}
.vil .st{display:inline-block;margin-top:10px;font-size:13px;padding:2px 10px;border-radius:999px;color:#fff;background:var(--st)}
.vil p{font-size:15px;margin:10px 0 0}
@media (max-width:760px){.villages{grid-template-columns:1fr 1fr}.vil:nth-child(3n){border-right:1px solid var(--line)}.vil:nth-child(2n){border-right:0}}

/* visit */
.rules{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.rule{background:var(--paper);border:1px solid var(--line);padding:18px 20px}
.rule b{display:block;font-size:16px;margin-bottom:4px}
.rule.no{border-left:5px solid var(--red)}
.rule.yes{border-left:5px solid var(--taro)}
.rule p{margin:0;font-size:15px;color:var(--ink-soft)}
@media (max-width:700px){.rules{grid-template-columns:1fr}}

/* game */
.game{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:center;background:var(--soot);color:var(--paper);padding:36px;border-radius:2px}
.game h3{font-size:30px;font-weight:900;color:var(--paper)}
.game p{color:var(--paper);opacity:.85}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.role{border:1px solid var(--ink-soft);padding:14px;font-size:15px}
a.role{display:block;color:var(--paper);text-decoration:none}
a.role:hover{border-color:var(--paper);border-width:2px;padding:13px}
a.role em{display:block;font-style:normal;font-size:13px;margin-top:6px;opacity:.8}
.gamelink{display:inline-block;margin-top:8px;font-weight:700}
.role b{display:block;font-family:var(--serif);font-size:17px}
.game .btn{background:var(--paper);color:var(--soot);border-color:var(--paper)}
@media (max-width:760px){.game{grid-template-columns:1fr;padding:24px}}

/* pacific */
.scroll{overflow-x:auto;border:1px solid var(--line);background:var(--paper)}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:15px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:700;background:var(--chip)}
td.w{font-family:var(--serif);font-weight:900;font-size:18px}
.partners{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-top:28px}
.partner{border-top:3px solid var(--kuroshio);padding-top:12px}
.partner h3{font-size:19px}
.partner p{font-size:15px;color:var(--ink-soft);margin:6px 0 0}

/* voyage map */
.voyage{display:grid;grid-template-columns:1.7fr 1fr;background:var(--deep);color:#F2F7F6;border-radius:2px;overflow:hidden}
.voyage svg{display:block;width:100%;height:auto}
.isle{cursor:pointer}
.isle circle.dot{fill:#F2F7F6;stroke:var(--deep);stroke-width:2}
.isle.on circle.dot{fill:#F4B860}
.isle circle.halo{fill:none;stroke:#8FE3DC;stroke-width:1.5;opacity:0}
.isle.on circle.halo,.isle:hover circle.halo,.isle:focus-visible circle.halo{opacity:1}
.isle:focus{outline:none}
.isle text{fill:#CFE7EA;font-size:15px}
.isle.on text{fill:#F4B860;font-weight:700}
.vpanel{padding:28px 26px;border-left:1px solid rgba(255,255,255,.15)}
.vpanel h3{font-size:26px;font-weight:900;color:#F2F7F6}
.vpanel .who{color:#8FE3DC;font-size:15px;margin:4px 0 14px}
.vpanel p{font-size:15px;color:#DCEBEC;margin:0 0 12px}
.vpanel .foods{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.vpanel .foods span{font-size:13px;padding:2px 10px;border-radius:999px;border:1px solid #8FE3DC;color:#8FE3DC}
.vpanel small{display:block;color:#A9C7CC;font-size:13px;border-top:1px solid rgba(255,255,255,.15);padding-top:10px}
.vhint{font-size:14px;color:var(--ink-soft);margin-top:10px}
.hauofa{font-family:var(--serif);font-size:clamp(20px,2.4vw,26px);line-height:1.6;max-width:36em;border-left:5px solid var(--lagoon);padding-left:18px;margin:0 0 32px}
.hauofa small{display:block;font-family:var(--sans);font-size:14px;color:var(--ink-soft);margin-top:6px}
@media (max-width:860px){.voyage{grid-template-columns:1fr}.vpanel{border-left:0;border-top:1px solid rgba(255,255,255,.15)}}

/* peoples */
.peoples{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ppl{padding:12px 14px;border:1px solid var(--line);background:var(--paper)}
.ppl.on{border:2px solid var(--red)}
.ppl b{display:block;font-size:16px}
.ppl span{font-size:13px;color:var(--ink-soft)}
.ppl em{font-style:normal;font-size:12px;display:block;margin-top:4px;color:var(--ink-soft)}
.ppl.on em{color:var(--red);font-weight:700}
.austro{margin-top:28px;display:flex;flex-wrap:wrap;gap:8px}

/* research */
.method{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.method h3{font-size:20px;margin-bottom:6px}
.method p{font-size:15px;margin:0;color:var(--ink-soft)}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;padding-left:2.2em;position:relative;margin-bottom:10px;font-size:15px}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:1.6em;height:1.6em;border-radius:50%;background:var(--soot);color:var(--paper);font-size:13px;display:grid;place-items:center}
@media (max-width:760px){.method{grid-template-columns:1fr}}

footer{padding:40px 0 56px;font-size:14px;color:var(--ink-soft)}

/* chat */
.chat-fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;font:inherit;font-weight:700;background:var(--red);color:#fff;border:0;border-radius:999px;padding:13px 20px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.chat{position:fixed;right:20px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;width:min(400px,calc(100vw - 40px));height:min(560px,calc(100vh - 140px));background:var(--paper);border:2px solid var(--soot);border-radius:4px;display:none;flex-direction:column}
.chat.open{display:flex}
.chat-h{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.chat-h b{font-family:var(--serif)}
.chat-h button{font:inherit;font-size:14px;background:none;border:1.5px solid var(--soot);color:var(--soot);border-radius:4px;padding:2px 10px;cursor:pointer}
.msgs{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px;font-size:15px}
.m{max-width:88%;padding:9px 12px;border-radius:4px;white-space:pre-wrap;line-height:1.65}
.m.u{align-self:flex-end;background:var(--soot);color:var(--paper)}
.m.a{align-self:flex-start;background:var(--chip);color:var(--soot)}
.sugs{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 10px}
.chat form{display:flex;border-top:1px solid var(--line)}
.chat input{flex:1;font:inherit;font-size:15px;padding:12px 14px;border:0;background:transparent;color:var(--soot)}
.chat form button{font:inherit;font-weight:700;border:0;background:var(--soot);color:var(--paper);padding:0 18px;cursor:pointer}
.chat .disc{font-size:12px;color:var(--ink-soft);padding:6px 16px 8px;border-top:1px solid var(--line)}
.taobar{display:none;background:var(--ochre);color:#1E1B19;font-size:14px;text-align:center;padding:6px 16px}
.taobar.show{display:block}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="brand" href="#top">TAROS <span>·</span> Pongso no Tao</a>
    <nav class="sections" aria-label="Sections">
      <a href="#taros" data-i="navTaros"></a>
      <a href="#pacific" data-i="navPacific"></a>
      <a href="#database" data-i="navDb"></a>
      <a href="#recipes" data-i="navRecipes"></a>
      <a href="#villages" data-i="navVillages"></a>
      <a href="#visit" data-i="navVisit"></a>
      <a href="#research" data-i="navResearch"></a>
    </nav>
    <div class="langs" role="group" aria-label="Language">

let curIsle="lanyu";
const px=lon=>(lon-110)/150*1000, py=lat=>(32-lat)/76*540;
function renderMap(){
  const svg=document.getElementById("vmap"); if(!svg) return;
  const by=id=>ISLANDS.find(i=>i.id===id);
  const home=by("lanyu"), hx=px(home.lon), hy=py(home.lat);
  const TW=[[121.5,25.3],[122.0,25.0],[121.85,24.5],[121.6,23.8],[121.4,23.1],[121.0,22.6],[120.85,21.9],[120.7,22.3],[120.3,22.6],[120.1,23.0],[120.15,23.6],[120.4,24.2],[120.7,24.6],[121.0,25.05]];
  const label=i=>esc(lang==="en"?i.en:i.zh);
  let h="";
  for(let lat=30;lat>=-40;lat-=10){ const y=py(lat); h+=`<line x1="0" x2="1000" y1="${y}" y2="${y}" stroke="#8FE3DC" stroke-opacity="${lat===0?.35:.08}" ${lat===0?'stroke-dasharray="2 6"':''}/>`; }
  for(let lon=120;lon<=250;lon+=20){ const x=px(lon); h+=`<line y1="0" y2="540" x1="${x}" x2="${x}" stroke="#8FE3DC" stroke-opacity=".06"/>`; }
  h+=`<text x="990" y="${py(0)-6}" text-anchor="end" fill="#8FE3DC" fill-opacity=".6" font-size="13">${esc(t("equator"))}</text>`;
  const tri=["hawaii","aotearoa","rapanui"].map(by).map(i=>`${px(i.lon)},${py(i.lat)}`).join(" ");
  h+=`<polygon points="${tri}" fill="#8FE3DC" fill-opacity=".05" stroke="#8FE3DC" stroke-opacity=".35" stroke-dasharray="6 6"/>`;
  h+=`<text x="${px(222)}" y="${py(-2)}" text-anchor="middle" fill="#8FE3DC" fill-opacity=".7" font-size="14" font-family="Noto Serif TC,serif">${esc(t("polyTri"))}</text>`;
  [["Micronesia","密克羅尼西亞",150,18],["Melanesia","美拉尼西亞",160,-8]].forEach(([e,z,lo,la])=>h+=`<text x="${px(lo)}" y="${py(la)}" fill="#8FE3DC" fill-opacity=".55" font-size="14" font-family="Noto Serif TC,serif">${esc(lang==="en"?e:z)}</text>`);
  h+=`<text x="10" y="${py(10)}" fill="#8FE3DC" fill-opacity=".55" font-size="13">${esc(t("toMadagascar"))}</text>`;
  /* routes from Lanyu */
  ISLANDS.filter(i=>!i.inset).forEach(i=>{ const x=px(i.lon), y=py(i.lat), mx=(hx+x)/2, my=Math.min(hy,y)-60-Math.abs(x-hx)*.12;
    h+=`<path d="M${hx},${hy} Q${mx},${my} ${x},${y}" fill="none" stroke="${i.id===curIsle?"#F4B860":"#8FE3DC"}" stroke-opacity="${i.id===curIsle?.9:.28}" stroke-width="${i.id===curIsle?2:1.2}" stroke-dasharray="3 6"/>`; });
  /* Taiwan on main map (small) */
  h+=`<polygon points="${TW.map(([lo,la])=>`${px(lo)},${py(la)}`).join(" ")}" fill="#F2F7F6" fill-opacity=".9"/>`;
  h+=`<circle cx="${hx}" cy="${hy}" r="3" fill="#F4B860"/><circle cx="${px(121.97)}" cy="${py(20.45)}" r="2.5" fill="#F2F7F6"/>`;
  h+=`<text x="${px(118.6)}" y="${py(26.4)}" fill="#F2F7F6" font-size="15" font-weight="700" font-family="Noto Serif TC,serif">${esc(lang==="en"?"Taiwan":"台灣")}</text>`;
  /* inset */
  const IX=24, IY=286, IW=210, IH=246, k=40, L0=119.3, LA0=26.35;
  const ix=lon=>IX+(lon-L0)*k, iy=lat=>IY+(LA0-lat)*k;
  h+=`<path d="M${px(121)},${py(21.5)} L${IX+IW/2},${IY}" stroke="#8FE3DC" stroke-opacity=".45" stroke-dasharray="2 4"/>`;
  h+=`<rect x="${IX}" y="${IY}" width="${IW}" height="${IH}" fill="#0E4554" stroke="#8FE3DC" stroke-opacity=".5" rx="2"/>`;
  h+=`<text x="${IX+10}" y="${IY+22}" fill="#F4B860" font-size="14" font-weight="700" font-family="Noto Serif TC,serif">${esc(t("insetTitle"))}</text>`;
  h+=`<path d="M${ix(122.4)},${iy(20.1)} C${ix(122.9)},${iy(22)} ${ix(122.3)},${iy(23.6)} ${ix(122.9)},${iy(25.4)}" fill="none" stroke="#5CC6C0" stroke-width="7" stroke-opacity=".35" stroke-linecap="round"/>`;
  h+=`<path d="M${ix(122.75)},${iy(25.2)} l-4,10 l9,-3z" fill="#5CC6C0" fill-opacity=".7"/>`;
  h+=`<text x="${ix(123.05)}" y="${iy(23.0)}" fill="#8FE3DC" font-size="12" writing-mode="${lang==="en"?"horizontal-tb":"vertical-rl"}" ${lang==="en"?`transform="rotate(-80 ${ix(123.05)} ${iy(23.0)})"`:""}>${esc(t("kuroshio"))}</text>`;
  const tw=by("taiwan");
  h+=`<g class="isle ${curIsle==="taiwan"?"on":""}" data-id="taiwan" tabindex="0" role="button" aria-label="${label(tw)}">
      <polygon points="${TW.map(([lo,la])=>`${ix(lo)},${iy(la)}`).join(" ")}" fill="${curIsle==="taiwan"?"#F4B860":"#F2F7F6"}" stroke="#0A2E3D" stroke-width="1.5"/>
      <text x="${ix(119.45)}" y="${iy(23.4)}" font-size="15">${label(tw)}</text></g>`;
  [["lanyu",122.0,22.05,"start"],["batanes",121.55,20.45,"end"]].forEach(([id,tx,ty,anc])=>{ const i=by(id), x=ix(i.lon), y=iy(i.lat);
    h+=`<g class="isle ${i.id===curIsle?"on":""}" data-id="${i.id}" tabindex="0" role="button" aria-label="${label(i)}">
      <circle class="halo" cx="${x}" cy="${y}" r="12"/><circle class="dot" cx="${x}" cy="${y}" r="${i.home?7:5}"/>
      <text x="${anc==="start"?x+12:x-12}" y="${y+5}" text-anchor="${anc}" font-size="14">${label(i)}</text></g>`; });
  /* other islands */
  ISLANDS.filter(i=>!i.inset).forEach(i=>{ const x=px(i.lon), y=py(i.lat); const left=i.id==="rapanui";
    h+=`<g class="isle ${i.id===curIsle?"on":""}" data-id="${i.id}" tabindex="0" role="button" aria-label="${label(i)}">
      <circle class="halo" cx="${x}" cy="${y}" r="14"/><circle class="dot" cx="${x}" cy="${y}" r="6"/>
      <text x="${left?x-14:x+14}" y="${y+5}" text-anchor="${left?"end":"start"}">${label(i)}</text></g>`; });
  svg.innerHTML=h;
  svg.querySelectorAll(".isle").forEach(g=>{ const go=()=>{curIsle=g.dataset.id;renderMap();};
    g.addEventListener("click",go); g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go();}}); });
  const i=by(curIsle);
  document.getElementById("vpanel").innerHTML=`<h3>${label(i)}</h3><div class="who">${esc(pick(i.who))}</div>
    <div class="foods">${pick(i.foods).map(f=>`<span>${esc(f)}</span>`).join("")}</div><p>${esc(pick(i.d))}</p>
    <small>${esc(i.home?t("startHere"):(i.id==="taiwan"?t("homeland"):t("partnerNote")))}</small>`;
}
function renderStars(){
  const svg=document.getElementById("stars"); let h=""; let seed=7;
  const r=()=>{seed=(seed*9301+49297)%233280;return seed/233280;};
  for(let k=0;k<70;k++){ h+=`<circle cx="${r()*1000}" cy="${r()*420}" r="${r()*1.4+.4}" fill="#fff" opacity="${r()*.6+.2}"/>`; }
  svg.innerHTML=h;
}

/* ============ 狀態與工具 ============ */
let lang = "zh";
const F = {q:"", cat:"all", season:"all", role:"all", src:"all"};
let curRecipe = "r1";
const L = () => lang === "en" ? "en" : "zh";
const t = k => (T[L()][k] ?? T.zh[k]);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pick = o => o ? (o[L()] ?? o.zh) : "";
const curSeason = () => { const m = new Date().getMonth()+1; return Object.keys(SEASONS).find(k => SEASONS[k].months.includes(m)); };
const seasonLabel = k => lang === "tao" ? SEASONS[k].tao : (lang==="en" ? `${SEASONS[k].en} (${SEASONS[k].tao})` : `${SEASONS[k].zh}（${SEASONS[k].tao}）`);
const foodTitle = f => {
  if (lang === "tao") return {main: f.tao, sub: `${f.zh} · ${f.en}`};
  if (lang === "en") return {main: f.en, sub: f.tao !== PENDING_TAO ? f.tao : "Tao name pending"};
  return {main: f.zh, sub: f.tao !== PENDING_TAO ? f.tao : PENDING_TAO};
};

/* ============ 季節輪 ============ */
function arc(cx,cy,r1,r2,a0,a1){
  const p=(r,a)=>[cx+r*Math.cos(a*Math.PI/180), cy+r*Math.sin(a*Math.PI/180)];
  const large = (a1-a0)>180?1:0;
  const [x0,y0]=p(r2,a0),[x1,y1]=p(r2,a1),[x2,y2]=p(r1,a1),[x3,y3]=p(r1,a0);
  return `M${x0},${y0} A${r2},${r2} 0 ${large} 1 ${x1},${y1} L${x2},${y2} A${r1},${r1} 0 ${large} 0 ${x3},${y3}Z`;
}
function drawWheel(){
  const svg = document.getElementById("wheel");
  const cs = curSeason(), m = new Date().getMonth()+1;
  const spans = {rayon:[-60,90], teyteyka:[90,210], amiyan:[210,300]};
  let h = "";
  for (const k of Object.keys(spans)){
    const [a0,a1]=spans[k], mid=(a0+a1)/2, r=150;
    const lx=200+r*Math.cos(mid*Math.PI/180), ly=200+r*Math.sin(mid*Math.PI/180);
    h += `<g class="wheel-seg" tabindex="0" role="button" data-season="${k}" aria-label="${esc(seasonLabel(k))}">
      <path d="${arc(200,200,108,192,a0+0.8,a1-0.8)}" fill="${SEASONS[k].color}" opacity="${k===cs?1:.78}"/>
      <text x="${lx}" y="${ly-4}" text-anchor="middle" fill="#fff" font-family="Noto Serif TC,serif" font-weight="900" font-size="22">${SEASONS[k].tao}</text>
      <text x="${lx}" y="${ly+18}" text-anchor="middle" fill="#fff" font-size="13">${esc(lang==="en"?SEASONS[k].en:SEASONS[k].zh)}</text>
    </g>`;
  }
  for (let i=1;i<=12;i++){
    const a=(i-1)*30-90+15, r=82;
    const x=200+r*Math.cos(a*Math.PI/180), y=200+r*Math.sin(a*Math.PI/180);
    h += `<text x="${x}" y="${y+5}" text-anchor="middle" font-size="${i===m?16:13}" font-weight="${i===m?700:400}" fill="${i===m?"var(--red)":"var(--ink-soft)"}">${i}</text>`;
  }
  const am=(m-1)*30-90+15;
  h += `<line x1="200" y1="200" x2="${200+60*Math.cos(am*Math.PI/180)}" y2="${200+60*Math.sin(am*Math.PI/180)}" stroke="var(--soot)" stroke-width="3" stroke-linecap="round"/><circle cx="200" cy="200" r="6" fill="var(--soot)"/>`;
  svg.innerHTML = h;
  svg.querySelectorAll(".wheel-seg").forEach(g=>{
    const go=()=>{F.season=g.dataset.season;renderFilters();renderGrid();document.getElementById("database").scrollIntoView();};
    g.addEventListener("click",go);
    g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go();}});
  });
  const s = SEASONS[cs];
  document.getElementById("now").style.setProperty("--season", s.color);
  document.getElementById("nowTitle").textContent = t("nowTitle").replace("{s}", seasonLabel(cs));
  document.getElementById("nowSub").textContent = lang==="en"? s.end : s.zhd;
}

/* ============ 資料庫 ============ */
function renderFilters(){
  const groups = [
    ["fCat","cat",[["all",t("all")],...Object.entries(CATS).map(([k,v])=>[k,pick(v)])]],
    ["fSeason","season",[["all",t("all")],...Object.keys(SEASONS).map(k=>[k,seasonLabel(k)])]],
    ["fRole","role",[["all",t("all")],...Object.entries(ROLES).map(([k,v])=>[k,pick(v)])]],
    ["fSrc","src",[["all",t("all")],["lit",t("lit")],["int",t("int")],["verify",pick(VERIFY)]]]
  ];
  document.getElementById("filters").innerHTML = groups.map(([lab,key,opts])=>
    `<div class="frow"><span class="lab">${t(lab)}</span>${opts.map(([v,txt])=>`<button class="chip" data-k="${key}" data-v="${v}" aria-pressed="${F[key]===v}">${esc(txt)}</button>`).join("")}</div>`).join("");
  document.querySelectorAll("#filters .chip").forEach(b=>b.onclick=()=>{F[b.dataset.k]=b.dataset.v;renderFilters();renderGrid();});
}
function matches(f){
  const q=F.q.trim().toLowerCase();
  if(q && ![f.zh,f.en,f.tao,f.d.zh,f.d.en].join(" ").toLowerCase().includes(q)) return false;
  if(F.cat!=="all" && f.cat!==F.cat) return false;
  if(F.season!=="all" && !f.seasons.includes(F.season)) return false;
  if(F.role!=="all" && f.role!==F.role) return false;
  if(F.src==="verify" && !f.verify) return false;
  if((F.src==="lit"||F.src==="int") && !f.src.includes(F.src)) return false;
  return true;
}
function tagsFor(f){
  return f.src.map(s=>`<span class="tag ${s}">${t(s)}</span>`).join("") +
    (f.verify?`<span class="tag verify">${esc(pick(VERIFY))}</span>`:"") +
    (f.game?`<span class="tag">${t("inGame")}</span>`:"");
}
function renderGrid(){
  const list = FOODS.filter(matches);
  document.getElementById("count").textContent = t("count").replace("{n}", list.length);
  const g = document.getElementById("grid");
  if(!list.length){ g.innerHTML = `<div class="empty">${t("empty")}</div>`; return; }
  g.innerHTML = list.map(f=>{ const ft=foodTitle(f); return `
    <button class="food" data-id="${f.id}" style="--cat:${CATS[f.cat].color}">
      <span class="tao">${esc(ft.main)}</span>
      <span class="sub">${esc(ft.sub)} · ${esc(pick(CATS[f.cat]))}</span>
      <p>${esc(pick(f.d))}</p>
      <span class="tags">${tagsFor(f)}</span>
    </button>`;}).join("");
  g.querySelectorAll(".food").forEach(b=>b.onclick=()=>openFood(b.dataset.id));
}
function openFood(id){
  const f = FOODS.find(x=>x.id===id), ft=foodTitle(f);
  const seas = f.seasons.length? f.seasons.map(seasonLabel).join("、") : pick(VERIFY);
  document.getElementById("dlgBody").innerHTML = `
    <button class="close" id="dlgClose">${t("close")}</button>
    <h3>${esc(ft.main)}</h3><div class="sub">${esc(ft.sub)}</div>
    <div class="tags" style="padding-top:12px">${tagsFor(f)}</div>
    <p>${esc(pick(f.d))}</p>
    <dl>
      <dt>${t("dGet")}</dt><dd>${esc(pick(f.get))}</dd>
      <dt>${t("dEat")}</dt><dd>${esc(pick(f.eat))}</dd>
      <dt>${t("dSeason")}</dt><dd>${esc(seas)}</dd>
      <dt>${t("dTaboo")}</dt><dd>${esc(pick(f.taboo))}</dd>
    </dl>
    <div class="srcs"><b>${t("dSrc")}</b><ul>${f.src.map(s=>`<li>${esc(t(s==="lit"?"litRef":"intRef"))}</li>`).join("")}</ul>${f.game?`<a class="gamelink" href="${GAME}" target="_blank" rel="noopener">${esc(t("meetInGame"))}</a>`:""}</div>`;
  const d=document.getElementById("dlg"); d.showModal();
  document.getElementById("dlgClose").onclick=()=>d.close();
}
document.getElementById("dlg").addEventListener("click",e=>{if(e.target.id==="dlg")e.target.close();});

/* ============ 食譜 ============ */
function renderRecipes(){
  document.getElementById("rlist").innerHTML = RECIPES.map(r=>`<button data-id="${r.id}" aria-current="${r.id===curRecipe}">${esc(lang==="en"?r.en:r.zh)}</button>`).join("");
  document.querySelectorAll("#rlist button").forEach(b=>b.onclick=()=>{curRecipe=b.dataset.id;renderRecipes();});
  const r = RECIPES.find(x=>x.id===curRecipe);
  const s = r.season==="all"? t("allYear") : seasonLabel(r.season);
  document.getElementById("rcard").innerHTML = `
    <h3>${esc(lang==="en"?r.en:r.zh)}</h3>
    <div class="meta">${esc(lang==="tao"?r.tao:(lang==="en"?"Tao name pending":r.tao))} · ${esc(s)} · ${esc(pick(r.who))}</div>
    <span class="tag verify">${esc(pick(VERIFY))}</span>
    <h4>${t("ing")}</h4><ul>${pick(r.ing).map(i=>`<li>${esc(i)}</li>`).join("")}</ul>
    <h4>${t("steps")}</h4><ol>${pick(r.steps).map(i=>`<li>${esc(i)}</li>`).join("")}</ol>
    <div class="note">${esc(pick(r.note))}</div>`;
}

function applyLang(){
  document.documentElement.lang = lang==="en"?"en":(lang==="tao"?"tao":"zh-Hant");
  document.querySelectorAll("[data-i]").forEach(el=>{const v=t(el.dataset.i); if(typeof v==="string") el.textContent=v;});
  document.getElementById("q").placeholder = t("search");
  document.getElementById("chatIn").placeholder = t("chatPh");
  document.getElementById("taobar").classList.toggle("show", lang==="tao");
  document.querySelectorAll(".langs button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.lang===lang));
  drawWheel(); renderMap(); renderFilters(); renderGrid(); renderRecipes(); renderStatic(); renderSugs();
}
document.querySelectorAll(".langs button").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;applyLang();});

const history=[];
const chat=document.getElementById("chat"), msgs=document.getElementById("msgs");
function addMsg(role,text){const d=document.createElement("div");d.className="m "+(role==="user"?"u":"a");d.textContent=text;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;return d;}
function renderSugs(){
  const box=document.getElementById("sugs");
  box.innerHTML = history.length? "" : t("sugs").map(s=>`<button class="chip">${esc(s)}</button>`).join("");
  box.querySelectorAll("button").forEach(b=>b.onclick=()=>ask(b.textContent));
}
function knowledge(){
  return JSON.stringify({
    note:"Prototype data. Items with verify:true or containing 待確認/待補 are NOT confirmed by the Tao community.",
    seasons:SEASONS, foods:FOODS.map(f=>({zh:f.zh,en:f.en,tao:f.tao,category:CATS[f.cat].en,seasons:f.seasons,gatheredBy:ROLES[f.role].en,get:f.get,whoEats:f.eat,desc:f.d,customs:f.taboo,sources:f.src,needsVerification:f.verify})),
    recipes:RECIPES, villages:VILLAGES, visitorRules:RULES, pacificWords:WORDS, taiwanPeoples:PEOPLES
  });
}
function buildPrompt(){
  const answerLang = lang==="en" ? "English" : "Traditional Chinese (Taiwan)";
  const intro = `You are the food assistant for TAROS, a prototype database on Tao (Yami) food sovereignty in Lanyu (Orchid Island), Taiwan, connected to Pacific Austronesian foodways.
Rules:
- Answer ONLY from the DATABASE below. If it isn't there, say the database doesn't have it yet and suggest asking Tao community members.
- When information is marked needsVerification, 待確認 or 待補, say clearly that it awaits community confirmation.
- Never invent Tao language words, ceremony details or taboos. Community knowledge comes first.
- Do not describe ceremonies in detail; encourage visitors to respect taboos.
- Mention whether an answer comes from literature, interviews, or both when relevant.
- Answer in ${answerLang}, in plain text without markdown, in 2 to 6 short sentences.
DATABASE:
${knowledge()}`;
  const turns = history.slice(-10).map(h=>({role:h.role, content:h.content}));
  turns[0] = {role:"user", content: intro + "\n\nQUESTION: " + turns[0].content};
  if (turns[0].role!=="user") turns.shift();
  return turns;
}
async function ask(q){
  q=q.trim(); if(!q||busy||!sample) return;
  busy=true; addMsg("user",q); history.push({role:"user",content:q}); renderSugs();
  const out=addMsg("assistant",t("thinking"));
  ctl=new AbortController();
  try{
    const {text}=await sample(buildPrompt(),{cache:false,signal:ctl.signal,onText:({text})=>{out.textContent=text;msgs.scrollTop=msgs.scrollHeight;}});
    out.textContent=text; history.push({role:"assistant",content:text});
  }catch(e){
    if(e && e.text){ out.textContent=e.text; history.push({role:"assistant",content:e.text}); }
    else { out.textContent = t("chatErr")[e?.code] || t("chatErr").def; history.pop(); }
    if(e?.code==="not_granted"){ document.getElementById("chatFab").hidden=true; }
  }finally{ busy=false; }
}
document.getElementById("chatForm").onsubmit=e=>{e.preventDefault();const i=document.getElementById("chatIn");ask(i.value);i.value="";};
document.getElementById("chatFab").onclick=()=>{chat.classList.toggle("open"); if(chat.classList.contains("open")){ if(!msgs.children.length) addMsg("assistant",t("chatHi")); document.getElementById("chatIn").focus(); }};
document.getElementById("chatClose").onclick=()=>chat.classList.remove("open");
(async()=>{ try{ if(window.claude){ sample=await claude.use("sample"); if(sample) document.getElementById("chatFab").hidden=false; } }catch(e){} })();

renderStars();
applyLang();
/* 從遊戲連回：#food-<id> 直接打開該食材 */
function openFromHash(){ const m=location.hash.match(/^#food-([a-z]+)$/); if(m && FOODS.some(f=>f.id===m[1])){ document.getElementById("database").scrollIntoView(); openFood(m[1]); } }
window.addEventListener("hashchange", openFromHash);
openFromHash();
</script>
</body>
